name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Every page in a real browser (desktop and phones): renders, no errors, no
      # sideways scroll; two devices on one library. With the runner's own
      # Google Chrome, so there's nothing to download first.
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chrome
