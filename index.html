<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Installable as an app ("Add to Home Screen"): full screen, own icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS home-screen icon: 180×180, opaque, full-bleed (iOS rounds the corners itself).
         Also at /apple-touch-icon.png, where iOS looks on its own. ?v= makes iOS fetch the new one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Confinium" />
    <title>Confinium Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
